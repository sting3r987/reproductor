# Revisión automática en cada cambio (push y pull request): sintaxis, pruebas de funciones y prueba completa con los
# emuladores de Firebase (dos cuentas editando a la vez, copias, reglas, sin conexión). No toca los datos reales.
name: Pruebas
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rapidas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
  completa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
